services:
  fitness-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brizfit-tracker
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7429}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/fitness.db
      - HOST_PORT=${HOST_PORT:-7429}
      - POCKET_ID_URL=${POCKET_ID_URL:-${VITE_POCKET_ID_URL}}
      - POCKET_ID_CLIENT_ID=${POCKET_ID_CLIENT_ID:-${VITE_CLIENT_ID:-brizfit-tracker}}
    volumes:
      - ./data:/data
    networks:
      - default

networks:
  default:
    name: home-network
