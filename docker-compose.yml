services:
  fitness-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brizfit-tracker
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7429}:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/fitness.db
      - POCKET_ID_URL=${POCKET_ID_URL:-http://pocket-id:80}
      - POCKET_ID_CLIENT_ID=${POCKET_ID_CLIENT_ID:-brizfit-tracker}
      - VITE_POCKET_ID_URL=${VITE_POCKET_ID_URL:-http://localhost:8080}
    volumes:
      - ./data:/data
    networks:
      - default

networks:
  default:
    name: home-network
